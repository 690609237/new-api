<style>
.home-feature-stack {
  display: grid;
  width: 100%;
  gap: 12px;
  color: var(--foreground);
  font-family: inherit;
}

.home-feature-stack *,
.home-feature-stack *::before,
.home-feature-stack *::after {
  box-sizing: border-box;
}

.home-feature-card {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 20px;
  border: 1px solid color-mix(in oklch, var(--feature-color) 16%, transparent);
  border-radius: 24px;
  background: color-mix(in oklch, var(--feature-color) 5%, transparent);
  box-shadow: 0 8px 28px -24px color-mix(in oklch, var(--feature-color) 70%, transparent);
}

.home-feature-card--operations {
  --feature-color: var(--warning);
}

.home-feature-card--pricing {
  --feature-color: var(--info);
}

.home-feature-card--groups {
  --feature-color: var(--chart-3);
  align-items: center;
}

.home-feature-icon {
  display: grid;
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  place-items: center;
  border-radius: 16px;
  background: color-mix(in oklch, var(--feature-color) 13%, transparent);
  color: var(--feature-color);
}

.home-feature-icon svg {
  width: 24px;
  height: 24px;
}

.home-feature-body {
  min-width: 0;
  flex: 1;
}

.home-feature-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.home-feature-title {
  margin: 0;
  color: var(--foreground);
  font-size: 16px;
  font-weight: 650;
  line-height: 24px;
}

.home-feature-description {
  margin: 8px 0 0;
  color: var(--muted-foreground);
  font-size: 14px;
  line-height: 24px;
}

.home-feature-list {
  display: grid;
  gap: 6px;
  margin: 8px 0 0;
  padding-left: 20px;
  color: var(--muted-foreground);
  font-size: 14px;
  line-height: 24px;
}

.home-feature-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.home-feature-tag {
  display: inline-flex;
  min-height: 24px;
  align-items: center;
  border: 1px solid color-mix(in oklch, var(--feature-color) 28%, transparent);
  border-radius: 999px;
  padding: 2px 10px;
  background: color-mix(in oklch, var(--background) 65%, transparent);
  color: color-mix(in oklch, var(--feature-color) 78%, var(--foreground));
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 13px;
  line-height: 18px;
}

.home-feature-groups-row {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

@media (max-width: 480px) {
  .home-feature-card {
    gap: 12px;
    padding: 16px;
    border-radius: 20px;
  }

  .home-feature-icon {
    width: 42px;
    height: 42px;
    flex-basis: 42px;
    border-radius: 14px;
  }

  .home-feature-groups-row {
    align-items: flex-start;
    flex-direction: column;
  }
}
</style>

</div>
